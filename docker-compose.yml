version: '3.8'

services:
  aidfa-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aidfa-app
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - db-data:/workspace/app/database
      - upload-data:/workspace/app/uploads
      - report-data:/workspace/app/reports
    restart: always

volumes:
  db-data:
  upload-data:
  report-data:
