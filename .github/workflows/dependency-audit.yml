# Dependency audit — runs pip-audit to detect known vulnerabilities
# in Python packages. Runs on every push to main and weekly on Sundays.
name: Dependency Audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly scan — catches newly disclosed CVEs
    - cron: "0 8 * * 0"

permissions:
  contents: read
  security-events: write   # for SARIF upload

jobs:
  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pip-audit>=2.4.14"
          pip install -r backend/requirements.txt

      - name: Run pip-audit (table)
        run: pip-audit -r backend/requirements.txt --progress-spinner=off || true

      - name: Run pip-audit (SARIF for GitHub Security tab)
        if: always()
        continue-on-error: true
        run: |
          pip-audit -r backend/requirements.txt --format sarif --output audit-results.sarif --progress-spinner=off || true

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: audit-results.sarif
        continue-on-error: true
